services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: altsmanager
      POSTGRES_PASSWORD: altsmanager
      POSTGRES_DB: altsmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altsmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
