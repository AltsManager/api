{% extends "sqladmin_original/base.html" %}
{% block head_tail %}
<style>
  :root {
    --tblr-primary: #13263f;
    --tblr-primary-rgb: 19, 38, 63;
  }

  body {
    background-color: #f4f5f7;
  }

  .navbar.navbar-vertical {
    background: linear-gradient(180deg, #0d1b2e 0%, #13263f 100%) !important;
  }

  .navbar-brand-autodark h3 {
    color: #c9a227;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 1.1rem;
    margin: 0;
  }

  .navbar-vertical .nav-link.active {
    background-color: rgba(201, 162, 39, 0.15);
    border-left: 3px solid #c9a227;
    color: #fff !important;
  }

  .btn-primary {
    background-color: #13263f;
    border-color: #13263f;
  }

  .btn-primary:hover,
  .btn-primary:focus {
    background-color: #0d1b2e;
    border-color: #0d1b2e;
  }

  .page-title {
    font-weight: 600;
    color: #13263f;
  }

  .card {
    border: 1px solid #e6e8eb;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
  }
</style>
{% endblock %}
